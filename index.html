<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#7c3aed">
  <title>Epsilon Edu - Tools</title>
  <style>
    *{box-sizing:border-box}
    :root{font-family:Arial,sans-serif;color:#334155;background:#fff}
    body{margin:0;background:#fff;color:#334155}
    button,input{font:inherit}
    .shell{width:min(100% - 16px,72rem);margin:0 auto}
    .top{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{font-weight:900;color:#7c3aed;font-size:20px;line-height:1.05}
    .brand small{display:block;color:#ec4899;font-size:11px;margin-top:4px;letter-spacing:.02em}
    .back{border:1px solid #ddd6fe;background:#faf5ff;color:#7c3aed;padding:10px 14px;border-radius:12px;font-weight:800;cursor:pointer;transition:.18s ease}
    .back:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(124,58,237,.12)}
    .hero{min-height:118px;border-radius:18px;background:linear-gradient(105deg,#e0f2fe,#fdf2f8 48%,#f5f3ff);display:flex;align-items:center;justify-content:center;text-align:center;padding:18px}
    .hero h1{margin:0;color:#1827f2;font-size:34px}.hero p{margin:5px 0 0;color:#7e22ce;font-weight:800}
    .status{margin:18px 0;border:1px solid #e9d5ff;border-radius:18px;padding:18px;text-align:center;font-weight:800}
    .status.loading{color:#64748b}.status.denied{background:#fff7ed;color:#9a3412;border-color:#fed7aa}.status.error{background:#fff1f2;color:#be123c;border-color:#fecdd3}
    .stage{min-height:360px;border:1px solid #f1e5f4;border-radius:20px;margin:18px 0 28px;background:#fff;overflow:hidden}
    .hidden{display:none!important}

    .catalog{padding:24px}
    .catalog-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}
    .catalog-head h2{margin:0;color:#1e293b;font-size:24px}.catalog-head p{margin:5px 0 0;color:#64748b;font-size:14px}
    .tool-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
    .tool-card{position:relative;border:1px solid #e9e5ff;background:linear-gradient(145deg,#fff,#fbfaff);border-radius:18px;padding:20px;text-align:left;min-height:172px;display:flex;flex-direction:column;gap:10px;transition:.18s ease}
    button.tool-card{cursor:pointer;color:inherit;width:100%}
    button.tool-card:hover{transform:translateY(-2px);border-color:#c4b5fd;box-shadow:0 10px 28px rgba(76,29,149,.10)}
    .tool-card.disabled{opacity:.65;cursor:default;background:#fafafa}
    .tool-icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#f3e8ff;font-size:25px}
    .tool-card h3{margin:0;color:#312e81;font-size:19px}.tool-card p{margin:0;color:#64748b;font-size:14px;line-height:1.45}
    .tool-meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;font-weight:800;color:#7c3aed}
    .soon{background:#f1f5f9;color:#64748b;padding:5px 8px;border-radius:999px}
    .tool-loading{min-height:320px;display:grid;place-items:center;text-align:center;color:#64748b;font-weight:800;padding:24px}
    .tool-loading::before{content:"";width:32px;height:32px;border:3px solid #ddd6fe;border-top-color:#7c3aed;border-radius:50%;animation:spin .75s linear infinite;margin:0 auto 12px;display:block}
    @keyframes spin{to{transform:rotate(360deg)}}

    @media (max-width:640px){
      .shell{width:min(100% - 12px,72rem)}
      .top{min-height:62px}.brand{font-size:18px}.back{padding:9px 11px;font-size:13px}
      .hero{min-height:104px;border-radius:16px}.hero h1{font-size:28px}.hero p{font-size:13px}
      .catalog{padding:16px}.catalog-head{align-items:start}.catalog-head h2{font-size:21px}.stage{margin-top:14px;border-radius:16px}
      .tool-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">Epsilon Edu<small>Tiến bộ từng ngày</small></div>
      <button class="back" id="back-btn" type="button">← Epsilon Edu</button>
    </header>

    <section class="hero">
      <div><h1>🧰 Tools</h1><p>Công cụ tiện ích dành cho tài khoản Trial/VIP</p></div>
    </section>

    <div id="status" class="status loading">Đang xác minh quyền truy cập...</div>
    <main id="stage" class="stage hidden" aria-label="Tools"></main>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
